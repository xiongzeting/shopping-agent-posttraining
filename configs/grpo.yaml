# Shopping Agent GRPO configuration.
defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:GRPO_TRAIN_FILE}
  val_files: ${oc.env:GRPO_VAL_FILE}
  # Qwen3.5 templates enable <think> by default when this flag is omitted.
  # Keep GRPO identical to SFT/Evaluation and force action-only generation.
  apply_chat_template_kwargs:
    enable_thinking: false
  train_batch_size: 2
  val_batch_size: 2
  max_prompt_length: 4096
  # AgentLoop bounds each assistant turn to 768 tokens and terminates after
  # at most 45 tool steps; keep the training-side tensor budget aligned with
  # that real rollout contract instead of reserving an unused 25k response.
  max_response_length: 25904
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:GRPO_MODEL_PATH}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_liger: true
    use_remove_padding: false
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
    lora:
      merge: true
    override_config:
      attn_implementation: flash_attention_2
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: null
    ppo_max_token_len_per_gpu: 30000
    use_dynamic_bsz: true
    freeze_vision_tower: true
    # Give every trajectory equal weight after averaging its response tokens.
    # This prevents long failure loops from dominating an update by token count.
    loss_agg_mode: seq-mean-token-mean
    clip_ratio_low: 0.20
    clip_ratio_high: 0.20
    entropy_coeff: 0.0
    calculate_entropy: false
    use_kl_loss: false
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.03
    fsdp_config:
      optimizer_offload: false
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.50
    max_num_seqs: 8
    max_model_len: 30000
    max_num_batched_tokens: 60000
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: null
    log_prob_max_token_len_per_gpu: 36000
    log_prob_use_dynamic_bsz: true
    agent:
      num_workers: 8
      default_agent_loop: shopping_tool_agent
      agent_loop_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/agent_loop.yaml
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 40
      max_assistant_turns: 40
      max_parallel_calls: 1
      max_tool_response_length: 16384
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/tools.json
      tokenization_sanity_check_mode: ignore_strippable
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:
    log_prob_micro_batch_size_per_gpu: null
    log_prob_max_token_len_per_gpu: 36000
    log_prob_use_dynamic_bsz: true
    fsdp_config:
      param_offload: false

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  rollout_correction:
    bypass_mode: true
    rollout_is: null
    rollout_rs: null
    loss_type: ppo_clip

shopping_dynamic_sampling:
  enable: true
  metric: seq_reward
  # A useful GRPO group must contain at least one Gold or Valid purchase.
  require_purchase_success: true
  # Initial rollout plus at most one retry. The second failed attempt is dropped.
  max_num_gen_batches: 2
  # If all groups are still unusable, skip this Actor update and advance the step.
  # Drop/retry groups whose terminal-utility range is <= this threshold.
  reward_tolerance: 0.025

reward_model:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.training.grpo.compat.install_torch_padding_fallback

trainer:
  total_epochs: 1
  total_training_steps: 100
  save_freq: 5
  # Run the independent validation/probe every ten optimizer steps.
  test_freq: -1
  val_before_train: false
  logger: [console]
  project_name: shopping-grpo
  experiment_name: shopping-agent-grpo
  default_local_dir: ${oc.env:GRPO_OUTPUT_DIR}
  n_gpus_per_node: 1
  nnodes: 1
